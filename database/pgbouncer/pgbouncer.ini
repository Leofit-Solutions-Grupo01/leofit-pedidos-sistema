; =============================================================================
; PGBOUNCER — CONNECTION POOLING TRANSACCIONAL
; SISTEMA DE GESTIÓN DE PEDIDOS - LEOFIT SOLUTIONS
; =============================================================================
; VERSION : 2.0.0
; MOTOR   : PgBouncer 1.22+ | PostgreSQL 16
; MODO    : transaction  (pool_mode recomendado para APIs REST/Node.js)
; =============================================================================
; ARRANQUE : pgbouncer /etc/pgbouncer/pgbouncer.ini
; RECARGA  : pgbouncer --reload /etc/pgbouncer/pgbouncer.ini
; CONSOLA  : psql -h 127.0.0.1 -p 6432 -U pgbouncer pgbouncer
; =============================================================================

[databases]
; ──────────────────────────────────────────────────────────────────────────────
; Base de datos principal — Nodo PRIMARY (lecturas/escrituras)
; ──────────────────────────────────────────────────────────────────────────────
leofit_db = host=127.0.0.1 port=5432 dbname=leofit_db
             auth_user=pgbouncer_auth
             pool_size=25
             reserve_pool=5
             pool_mode=transaction

; ──────────────────────────────────────────────────────────────────────────────
; Alias de sólo lectura → apunta al STANDBY (Streaming Replication)
; El backend puede elegir este DSN para queries de reporting/dashboard.
; ──────────────────────────────────────────────────────────────────────────────
leofit_db_ro = host=10.0.0.11 port=5432 dbname=leofit_db
               auth_user=pgbouncer_auth
               pool_size=15
               reserve_pool=3
               pool_mode=transaction

; ──────────────────────────────────────────────────────────────────────────────
; Base de datos de administración PgBouncer (consola interna)
; Acceder: psql -h 127.0.0.1 -p 6432 -U pgbouncer pgbouncer
; ──────────────────────────────────────────────────────────────────────────────
pgbouncer = host=127.0.0.1


[pgbouncer]
; ══════════════════════════════════════════════════════════════════════════════
; MODO DE POOLING
; ══════════════════════════════════════════════════════════════════════════════
; transaction : la conexión al servidor se libera tras cada COMMIT/ROLLBACK.
;               Ideal para aplicaciones stateless (APIs REST, Node.js).
;               ⚠️  Incompatible con: SET, LISTEN, advisory locks, cursores
;               WITH HOLD y prepared statements sin pipeline (usar
;               server_reset_query para limpiar estado si es necesario).
pool_mode = transaction

; ══════════════════════════════════════════════════════════════════════════════
; RED Y PUERTOS
; ══════════════════════════════════════════════════════════════════════════════
listen_addr   = 127.0.0.1          ; sólo loopback; cambiar a 0.0.0.0 si el
                                    ; backend está en otro host
listen_port   = 6432               ; puerto estándar PgBouncer
unix_socket_dir = /var/run/postgresql

; ══════════════════════════════════════════════════════════════════════════════
; AUTENTICACIÓN
; ══════════════════════════════════════════════════════════════════════════════
; auth_type scram-sha-256 es el estándar de PG16.
; auth_file contiene el mapa usuario → hash scram/md5.
; Generar: psql -c "SELECT usename, passwd FROM pg_shadow" > userlist.txt
auth_type     = scram-sha-256
auth_file     = /etc/pgbouncer/userlist.txt

; auth_query permite delegar la autenticación a PostgreSQL directamente
; (requiere rol pgbouncer_auth con acceso a pg_shadow o función dedicada)
auth_query    = SELECT usename, passwd FROM pg_shadow WHERE usename = $1

; ══════════════════════════════════════════════════════════════════════════════
; TAMAÑOS DE POOL
; ══════════════════════════════════════════════════════════════════════════════
; max_client_conn: conexiones totales aceptadas desde la aplicación.
; default_pool_size: conexiones reales a PostgreSQL por (usuario, BD).
; reserve_pool_size: conexiones extra de emergencia (activadas por timeout).
; reserve_pool_timeout: segundos de espera antes de usar el pool de reserva.
max_client_conn      = 200
default_pool_size    = 25
reserve_pool_size    = 5
reserve_pool_timeout = 3

; min_pool_size mantiene conexiones calientes al servidor aunque no haya carga
min_pool_size        = 5

; ══════════════════════════════════════════════════════════════════════════════
; TIMEOUTS
; ══════════════════════════════════════════════════════════════════════════════
; server_idle_timeout : cerrar conexiones al servidor inactivas > N segundos
; client_idle_timeout : cerrar clientes inactivos > N segundos
; query_timeout       : cancelar queries que excedan N segundos (0 = sin límite)
; connect_timeout     : tiempo máximo para abrir conexión al servidor PG
; server_lifetime     : rotar conexiones al servidor cada N segundos (evita
;                       acumulación de memory leaks en PG long-lived connections)
server_idle_timeout  = 600
client_idle_timeout  = 0
query_timeout        = 0
connect_timeout      = 15
server_lifetime      = 3600

; ══════════════════════════════════════════════════════════════════════════════
; SEGURIDAD TLS (habilitar en producción)
; ══════════════════════════════════════════════════════════════════════════════
; client_tls_sslmode  : cifrado cliente → PgBouncer
; server_tls_sslmode  : cifrado PgBouncer → PostgreSQL
;
; client_tls_sslmode  = require
; client_tls_cert_file = /etc/pgbouncer/certs/pgbouncer.crt
; client_tls_key_file  = /etc/pgbouncer/certs/pgbouncer.key
; client_tls_ca_file   = /etc/pgbouncer/certs/ca.crt
;
; server_tls_sslmode  = require
; server_tls_ca_file  = /etc/ssl/certs/ca-certificates.crt

; ══════════════════════════════════════════════════════════════════════════════
; RESET QUERY (transaction mode)
; ══════════════════════════════════════════════════════════════════════════════
; En modo transaction, se ejecuta entre cada reutilización de conexión
; para limpiar SET LOCAL, configuraciones de sesión, etc.
server_reset_query   = DISCARD ALL

; Si DISCARD ALL es muy costoso y se confía en la aplicación:
; server_reset_query = ;

; ══════════════════════════════════════════════════════════════════════════════
; LOGGING Y MONITOREO
; ══════════════════════════════════════════════════════════════════════════════
logfile          = /var/log/pgbouncer/pgbouncer.log
pidfile          = /var/run/pgbouncer/pgbouncer.pid

; Niveles de log: 0 = errors, 1 = warnings, 2 = info, 3 = debug
log_connections  = 1
log_disconnections = 1
log_pooler_errors  = 1
verbose          = 0                ; cambiar a 1 sólo para debugging

; Estadísticas cada N segundos (visibles en consola pgbouncer)
stats_period     = 60

; ══════════════════════════════════════════════════════════════════════════════
; USUARIO ADMINISTRADOR DE LA CONSOLA PGBOUNCER
; ══════════════════════════════════════════════════════════════════════════════
admin_users      = pgbouncer
stats_users      = pgbouncer, monitoring_user

; ══════════════════════════════════════════════════════════════════════════════
; PREPARACIÓN PARA PREPARED STATEMENTS (PG16 + protocolo extendido)
; ══════════════════════════════════════════════════════════════════════════════
; En transaction mode los prepared statements por sesión no persisten entre
; transacciones. Usar 'max_prepared_statements' para activar el caché interno
; de PgBouncer (disponible desde PgBouncer 1.21).
max_prepared_statements = 100

; ══════════════════════════════════════════════════════════════════════════════
; IGNORAR PARÁMETROS DE STARTUP (compatibilidad con ORMs / drivers modernos)
; ══════════════════════════════════════════════════════════════════════════════
; node-postgres, Prisma, TypeORM envían estos parámetros al conectar.
ignore_startup_parameters = extra_float_digits, options, application_name