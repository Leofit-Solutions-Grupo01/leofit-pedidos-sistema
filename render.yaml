services:
  # 1. LeoFit Backend API REST Service
  - type: web
    name: leofit-backend-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: leofit-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_SECRET_V1
        sync: false
      - key: JWT_KID
        value: v1
      - key: CORS_ORIGIN
        value: "https://leofit-frontend.onrender.com,https://leofit-solutions-grupo01.github.io,https://leofit-pedidos-sistema.netlify.app,https://leofit.pe,https://www.leofit.pe"
      - key: WEBHOOK_SECRET
        sync: false
      - key: CULQI_SECRET_KEY
        sync: false
      - key: CULQI_WEBHOOK_SECRET
        sync: false
      - key: NUBEFACT_URL
        sync: false
      - key: NUBEFACT_TOKEN
        sync: false
      - key: NUBEFACT_API_KEY
        sync: false
      - key: NUBEFACT_RUC
        sync: false
      - key: COOKIE_DOMAIN
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: ADMIN_CLEANUP_SECRET
        sync: false

  # 2. LeoFit Frontend PWA Static Site
  - type: web
    name: leofit-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://leofit-backend-api.onrender.com
      - key: VITE_APP_ENV
        value: production

databases:
  # 3. PostgreSQL 16 Managed Database
  - name: leofit-postgres
    plan: free
    region: oregon
    databaseName: leofit_db
    user: leofit_user
