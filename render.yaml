services:
  # 1. LeoFit Backend API REST Service
  - type: web
    name: leofit-backend-api
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: leofit-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: "https://leofit-frontend.onrender.com,https://leofit-solutions-grupo01.github.io,https://leofit-pedidos-sistema.netlify.app"

  # 3. LeoFit Frontend PWA Static Site
  - type: static
    name: leofit-frontend
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://leofit-backend-api.onrender.com
      - key: VITE_APP_ENV
        value: production


databases:
  # 2. PostgreSQL 16 Managed Database
  - name: leofit-postgres
    plan: free
    region: oregon
    databaseName: leofit_db
    user: leofit_user
