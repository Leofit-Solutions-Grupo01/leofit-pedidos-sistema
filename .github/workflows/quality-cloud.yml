name: Calidad en la nube (APF3) - Lighthouse + Smoke

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  lighthouse:
    name: Lighthouse (usabilidad / accesibilidad / rendimiento) sobre GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://leofit-solutions-grupo01.github.io/leofit-pedidos-sistema/
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 3

  cloud-smoke:
    name: Pruebas funcionales y de integración contra Render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: ./backend
      - name: Smoke tests en producción
        working-directory: ./backend
        env:
          CLOUD_API_URL: https://leofit-backend-api.onrender.com
          CLOUD_ADMIN_EMAIL: ${{ secrets.CLOUD_ADMIN_EMAIL }}
          CLOUD_ADMIN_PASSWORD: ${{ secrets.CLOUD_ADMIN_PASSWORD }}
        run: npm run test:cloud
