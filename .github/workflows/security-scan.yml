name: Security & Code Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-audit:
    name: Dependency Audit & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scan Frontend Dependencies
        run: |
          if [ -d "frontend" ] && [ -f "frontend/package.json" ]; then
            cd frontend
            npm audit --audit-level=high || echo "Advisories found - review before production"
            cd ..
          fi

      - name: Check for Uncommitted Env Files
        run: |
          if git ls-files --error-unmatch .env .env.local .env.production 2>/dev/null; then
            echo "ERROR: Real .env file detected in Git tracking! Remove immediately."
            exit 1
          else
            echo "SUCCESS: No tracked .env files detected."
          fi
